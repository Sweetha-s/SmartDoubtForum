# Project-wide Gradle settings

# JVM settings (improves performance)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable AndroidX (IMPORTANT - fixes your error)
android.useAndroidX=true

# Automatically convert old libraries to AndroidX
android.enableJetifier=true

# Enable parallel build (faster builds)
org.gradle.parallel=true

# Use Android Studio default non-transitive R class
android.nonTransitiveRClass=true

# Kotlin code style (safe to keep even if not using Kotlin)
kotlin.code.style=official